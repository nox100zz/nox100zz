name: Refresh GitHub Profile Card

on:
  workflow_dispatch:

  schedule:
    # Every day at 06:17 UTC (13:17 Vietnam time)
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate ASCII Profile Cards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate ASCII cards from custom portrait
        env:
          HANDLE: nox100zz
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          set -euo pipefail

          # Ensure custom portrait exists
          if [ ! -s portrait.png ]; then
            echo "::error::portrait.png is missing or empty."
            exit 1
          fi

          # Generate Dark and Light ASCII cards
          for theme in dark light; do
            output="${theme}_mode.svg"

            echo "Generating ${theme} mode..."

            curl -fsSL \
              --connect-timeout 15 \
              --max-time 120 \
              --retry 3 \
              --retry-delay 5 \
              --retry-max-time 180 \
              -F "image=@portrait.png" \
              -F "theme=${theme}" \
              "${GH_ASCII_URL}/${HANDLE}" \
              -o "$output"

            # Validate generated SVG
            if [ ! -s "$output" ] || ! grep -q '<svg' "$output"; then
              echo "::error::Invalid SVG generated for ${theme} mode."
              exit 1
            fi
          done

      - name: Commit and push updated cards
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dark_mode.svg light_mode.svg

          if git diff --cached --quiet; then
            echo "Profile cards unchanged."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
